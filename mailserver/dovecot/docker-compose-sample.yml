version: "3"
services:

    mailserver-dovecot:
        container_name: mailserver-dovecot
        image: mailserver-dovecot:latest
        restart: always
        stdin_open: true
        tty: true
        env_file: .env-sample
        mem_limit: "1G"
        volumes:
          - ./postfix-spool-private:/var/spool/postfix/private 
#          - ./vmail:/srv/vmail
          - ./dovecot-conf/conf.d:/etc/dovecot/conf.d
#          - ./dovecot-conf/dovecot.conf:/etc/dovecot/dovecot.conf
#          - ./dovecot-conf/vendor.d/:/etc/dovecot/vendor.d
          - ../../traefik/letsencrypt/certs/certs/cert.crt:/etc/dovecot/ssl/cert.crt
          - ../../traefik/letsencrypt/certs/private/cert.key:/etc/dovecot/ssl/cert.key
#          - /usr/bin/ls:/dovecot/bin/ls
#          - /usr/bin/whoami:/dovecot/bin/whoami
        networks:
          nat:
            ipv4_address: 10.0.5.14
          internal:
            ipv4_address: 10.0.2.35
        ports:
          - 143:143 #imap
          - 993:993 # imaps
          - 110:110 # pop3
          - 995:995 # pop3s
#          - 24:24 # lmtps
          - 4190:4190 # managesieve

networks:
    nat:
      external:
            name: nat
    internal:
      external:
            name: internal.60