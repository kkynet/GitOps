# ==============================================================================
# Dovecot MySQL Authentication Configuration
# ==============================================================================
# Database: mx
# Table: mail_user
# ==============================================================================

# MySQL driver
driver = mysql

# Connection string
# Format: host=hostname port=port dbname=database user=username password=password
connect = host=mariadb-galera-node0 port=3306 dbname=mx user=postfix password=postfixpass

# Default password scheme (Dovecot will auto-detect from password field)
default_pass_scheme = SHA512-CRYPT

# ==============================================================================
# PASSWORD QUERY - Authentication
# ==============================================================================
# Purpose: Verify user credentials saat login
# Called when: User login via IMAP/POP3/SMTP AUTH
# Returns: username dan password hash untuk verification
# ==============================================================================

password_query = \
    SELECT \
        email as user, \
        password \
    FROM mail_user \
    WHERE email = '%u' \
        AND active = 'y'

# Variables explained:
# %u = full email address
# 
# Query returns:
# - user: email address 
# - password: hashed password ({SHA512-CRYPT}$6$...)
#
# Dovecot will compare provided password with this hash

# ==============================================================================
# USER QUERY - User Information
# ==============================================================================
# Purpose: Get user mailbox location, UID, GID, quota setelah auth sukses
# Called when: After successful authentication
# Returns: mailbox path, ownership, quota settings
# ==============================================================================

user_query = \
    SELECT \
        CONCAT('/var/vmail/', maildir) as home, \
        CONCAT('maildir:/var/vmail/', maildir) as mail, \
        5000 as uid, \
        5000 as gid, \
        CONCAT('*:storage=', IFNULL(quota, 0), 'M') as quota_rule, \
        CONCAT('*:messages=', IFNULL(quota, 0) * 1000) as quota_rule2 \
    FROM mail_user \
    WHERE email = '%u' \
        AND active = 'y'

# Query breakdown:
# 
# home = /var/vmail/domain.com/user
#   - User's home directory (base path untuk mailbox)
#
# mail = maildir:/var/vmail/domain.com/user
#   - Maildir format location
#   - Format: maildir:<path>
#
# uid = 5000 (vmail user)
#   - File ownership UID
#
# gid = 5000 (vmail group)
#   - File ownership GID
#
# quota_rule = *:storage=0M
#   - Quota limit in MB (0 = unlimited)
#   - Format: *:storage=<size>M
#   - Jika quota=1000 → limit 1000MB = 1GB
#
# quota_rule2 = *:messages=0
#   - Message count limit
#   - 0 = unlimited
#
# Example result
# home:        /var/vmail/domain.com/user
# mail:        maildir:/var/vmail/domain.com/user
# uid:         5000
# gid:         5000
# quota_rule:  *:storage=0M
# quota_rule2: *:messages=0

# ==============================================================================
# ITERATE QUERY - List All Users
# ==============================================================================
# Purpose: Enumerate semua users (untuk doveadm tools)
# Called when: Running doveadm commands (maintenance, bulk operations)
# Returns: list of all active users
# ==============================================================================

iterate_query = \
    SELECT \
        email as user \
    FROM mail_user \
    WHERE active = 'y'

# Usage examples:
# doveadm user '*'           - list all users
# doveadm quota get -A       - get quota for all users
# doveadm expunge -A mailbox INBOX savedbefore 30d

# ==============================================================================
# NOTES
# ==============================================================================
# 
# Password Schemes Supported:
# - SHA512-CRYPT (your current: {SHA512-CRYPT}$6$...)
# - PLAIN (not recommended)
# - MD5-CRYPT
# - SHA256-CRYPT
# - ARGON2I (modern, recommended for new deployments)
#
# Dovecot auto-detects scheme from prefix: {SHA512-CRYPT}
#
# Quota = 0 means UNLIMITED
# To set quota: UPDATE mail_user SET quota=1000 WHERE email='user@domain.com';
# (1000 = 1000MB = 1GB)
#
# Variables available in queries:
# %u = full email (user@domain.com)
# %n = username part (user)
# %d = domain part (domain.com)
# %s = service (imap, pop3, smtp, lmtp)
#
# ==============================================================================