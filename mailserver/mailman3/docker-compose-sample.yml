version: "3"
services:

    mailserver-mailman-db:
        container_name: mailserver-mailman-db
        image: bitnamilegacy/mariadb-galera:12.0
        restart: always
        stdin_open: true
        tty: true
        mem_limit: "2G"
        volumes:
          - /home/administrator/docker/tamvan/vol/mailserver/mailman3/db/data:/bitnami/mariadb
          - /home/administrator/docker/tamvan/vol/mailserver/mailman3/db/conf:/opt/bitnami
        env_file:
          - ./.env
        secrets:
          - mariadb-root-sample
          - mailman-user-sample
          - mailman-pass-sample
        networks:
           internal:
              ipv4_address: 10.0.2.38
        healthcheck:
          test: ['CMD', '/opt/bitnami/scripts/mariadb-galera/healthcheck.sh']
          interval: 15s
          timeout: 5s
          retries: 6

    mailserver-mailman-core:
        container_name: mailserver-mailman-core
        image: maxking/mailman-core:0.5
        hostname: lists.domain.com
        restart: always
        stdin_open: true
        tty: true
        env_file:
          - ./.env-mailman-core-sample
        mem_limit: "2G"
        volumes:
          - /home/administrator/docker/tamvan/vol/mailserver/mailman3/core:/opt/mailman/
        networks:
          nat:
            ipv4_address: 10.0.5.16
          internal:
            ipv4_address: 10.0.2.39
        ports:
          - "8001:8001"
          - "8024:8024"

    mailserver-mailman-web:
        container_name: mailserver-mailman-web
        image: maxking/mailman-web:0.5
        restart: always
        stdin_open: true
        tty: true
        env_file:
          - ./.env-mailman-web-sample
        mem_limit: "2G"
        volumes:
          - /home/administrator/docker/tamvan/vol/mailserver/mailman3/web:/opt/
        networks:
          nat:
            ipv4_address: 10.0.5.17
          internal:
            ipv4_address: 10.0.2.40
        ports:
          - "127.0.0.7:8082:8080"
#          - "8000:8000"

    mailserver-mailman-nginx:
        container_name: mailserver-mailman-nginx
        image: nginx:latest
        restart: always
        stdin_open: true
        tty: true
        env_file:
          - ./.env-mailman-web-sample
        mem_limit: "2G"
        volumes:
          - /home/administrator/docker/tamvan/vol/mailserver/mailman3/web:/opt/mailman/web
          - /home/administrator/docker/tamvan/vol/mailserver/mailman3/nginx/nginx-mailman.conf:/etc/nginx/conf.d/default.conf
        labels:
          - "traefik.enable=true"
          - "traefik.http.routers.mailmanwebnginx.rule=Host(`lists.domain.com`)"
          - "traefik.http.routers.mailmanwebnginx.entrypoints=https"
          - "traefik.http.routers.mailmanwebnginx.tls=true"
          - "traefik.http.services.mailmanwebnginx.loadbalancer.server.port=80"
        networks:
          nat:
            ipv4_address: 10.0.5.18
          internal:
            ipv4_address: 10.0.2.41

secrets:
  mariadb-root-sample:
    file: ./mariadb-root-sample
  mailman-user-sample:
    file: ./mailman-user-sample
  mailman-pass-sample:
    file: ./mailman-pass-sample


networks:
    nat:
      external:
            name: nat
    internal:
      external:
            name: internal.60

