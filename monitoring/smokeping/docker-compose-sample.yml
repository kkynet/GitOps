version: "3"
services:

   smokeping:
       container_name: smokeping
       image: linuxserver/smokeping
       restart: always
       stdin_open: true
       tty: true
       privileged: true
       cap_add:
        - NET_ADMIN
       env_file:
        - ./.env-sample
       volumes:
         - ./config:/config
         - ./data:/data
         - ./init:/init
       networks:
         nat:
           ipv4_address: 10.0.5.4
         internal:
           ipv4_address: 10.0.2.11

networks: 
    nat:
        external: 
            name: nat
    internal:
        external:
            name: internal.ipvlanl3_60
