log:
  level: DEBUG
  format: common

api:
  dashboard: true
  debug: true
#  insecure: true

entryPoints:
  http:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: https
          scheme: https
  https:
    address: ":443"

serversTransport:
  insecureSkipVerify: true

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: nat
  # file:
  #   filename: /config.yml

certificatesResolvers:
  rfc2136:
    acme:
      email: email@domain.com
      storage: acme.json
      keyType: RSA2048
      caServer: https://acme-v02.api.letsencrypt.org/directory # prod (default)
      dnsChallenge:
        provider: rfc2136
        delayBeforeCheck: 60s # uncomment along with disablePropagationCheck if needed to ensure the TXT record is ready before verification is attempted 
        resolvers:
        - "10.0.5.26:53"

  letsencrypt:
    acme:
      email: email@domain.com
      storage: acme-coolify.json
      keyType: RSA2048
      caServer: https://acme-v02.api.letsencrypt.org/directory
      dnsChallenge:
        provider: rfc2136
        delayBeforeCheck: 60s
        resolvers:
        - "10.0.5.26:53"

